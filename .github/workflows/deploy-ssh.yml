# Deploy static landing site to VPS over SSH.
# Secrets: SSH_PRIVATE_KEY (+ SSH_PASSPHRASE if the key is encrypted).
#
# The site is a static export of CMS data. Every 30 minutes the schedule compares a hash of
# the API responses the build reads with /cms-version.txt on the live site, and rebuilds only
# when they differ, so a project or article published in the dashboard gets its page.
name: Deploy (SSH)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: design-production-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint CMS content
        id: cms
        env:
          API: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          api="${API%/}"
          body=""
          ok=true
          for path in articles portfolio/projects portfolio/clients pricing reels legal/privacy legal/terms; do
            if ! part="$(curl -fsS --retry 3 --max-time 30 -H 'Accept: application/json' "$api/$path")"; then
              ok=false
              break
            fi
            body="$body$part"
          done
          hash=""
          if [ "$ok" = true ]; then
            hash="$(printf '%s' "$body" | sha256sum | cut -c1-64)"
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            live="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://hoc.agency/cms-version.txt 2>/dev/null | tr -d '[:space:]' || true)"
            if [ -z "$hash" ]; then
              echo "API unreachable; keep the live site"
              skip=true
            elif [ "$hash" = "$live" ]; then
              echo "CMS content unchanged since the last build"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.cms.outputs.skip != 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.cms.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build static export
        if: steps.cms.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_USE_DEMO_DATA: "false"
          NEXT_PUBLIC_BASE_PATH: "none"
          NEXT_PUBLIC_SITE_URL: "https://hoc.agency"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ secrets.NEXT_PUBLIC_DASHBOARD_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          npm ci
          npm run build
          test -d out
          echo "${{ steps.cms.outputs.hash }}" > out/cms-version.txt

      - name: Start SSH agent
        if: steps.cms.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          key_file="$(mktemp)"
          askpass_file="$(mktemp)"
          trap 'rm -f "$key_file" "$askpass_file"' EXIT
          umask 177
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          if ! grep -q 'BEGIN OPENSSH PRIVATE KEY' "$key_file"; then
            echo "SSH_PRIVATE_KEY secret is missing OpenSSH header. Re-run deploy/push-github-secrets.ps1"
            exit 1
          fi

          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            export SSH_PASSPHRASE
            printf '%s\n' '#!/bin/sh' 'exec printf "%s" "$SSH_PASSPHRASE"' > "$askpass_file"
            chmod 700 "$askpass_file"
            DISPLAY=:0 SSH_ASKPASS="$askpass_file" SSH_ASKPASS_REQUIRE=force ssh-add "$key_file" < /dev/null
          else
            ssh-add "$key_file" < /dev/null
          fi

      - name: Sync to server
        if: steps.cms.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set SSH_HOST}"
          : "${SSH_USER:?Set SSH_USER}"
          PORT="${SSH_PORT:-22}"
          REMOTE="${DEPLOY_PATH:-/var/www/landing/design}"
          case "$REMOTE" in
            /var/www/*) ;;
            *) echo "DEPLOY_PATH must be under /var/www"; exit 1 ;;
          esac

          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          SSH=(ssh -p "$PORT" -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '$REMOTE'"

          rsync -az --delete \
            -e "ssh -p $PORT" \
            out/ "${SSH_USER}@${SSH_HOST}:${REMOTE}/"

          echo "Landing deployed to ${REMOTE}"
          curl -sS "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"hoc.agency","key":"c4e8a91b7d2f40c6a5e13b8f0d9c276a","keyLocation":"https://hoc.agency/c4e8a91b7d2f40c6a5e13b8f0d9c276a.txt","urlList":["https://hoc.agency/","https://hoc.agency/pricing/","https://hoc.agency/social/","https://hoc.agency/locations/","https://hoc.agency/sitemap.xml"]}' \
            >/dev/null || true
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "cd /var/www/landing/backend && docker compose --env-file .env -f deploy/compose.yaml exec -T hoc-api php artisan seo:submit-sitemap" || true
