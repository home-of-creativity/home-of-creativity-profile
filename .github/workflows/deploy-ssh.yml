# Deploy static landing site to VPS over SSH.
# Secrets: SSH_PRIVATE_KEY (+ SSH_PASSPHRASE if the key is encrypted).
name: Deploy (SSH)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: design-production-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build static export
        env:
          NEXT_PUBLIC_USE_DEMO_DATA: "false"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ secrets.NEXT_PUBLIC_DASHBOARD_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          npm ci
          npm run build
          test -d out

      - name: Start SSH agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          key_file="$(mktemp)"
          askpass_file="$(mktemp)"
          trap 'rm -f "$key_file" "$askpass_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            export SSH_PASSPHRASE
            printf '%s\n' '#!/bin/sh' 'exec printf "%s" "$SSH_PASSPHRASE"' > "$askpass_file"
            chmod 700 "$askpass_file"
            DISPLAY=:0 SSH_ASKPASS="$askpass_file" SSH_ASKPASS_REQUIRE=force ssh-add "$key_file" < /dev/null
          else
            ssh-add "$key_file" < /dev/null
          fi

      - name: Sync to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set SSH_HOST}"
          : "${SSH_USER:?Set SSH_USER}"
          PORT="${SSH_PORT:-22}"
          REMOTE="${DEPLOY_PATH:-/var/www/landing/design}"
          case "$REMOTE" in
            /var/www/*) ;;
            *) echo "DEPLOY_PATH must be under /var/www"; exit 1 ;;
          esac

          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          SSH=(ssh -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '$REMOTE'"

          rsync -az --delete \
            -e "ssh -p $PORT -o IdentitiesOnly=yes" \
            out/ "${SSH_USER}@${SSH_HOST}:${REMOTE}/"

          echo "Landing deployed to ${REMOTE}"
